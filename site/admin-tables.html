<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>云库数据表 · 后台</title>
<style>
:root{
  --bg:#f4f6fb; --card:#fff; --line:#e4e8f0; --fg:#1c2333; --sub:#6b7488;
  --acc:#2f6df6; --acc2:#0f9d58; --warn:#e65100; --danger:#d32f2f; --radius:12px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:"Microsoft YaHei","微软雅黑",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px;line-height:1.6}
code,pre,.mono{font-family:Consolas,"Courier New",monospace}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#1e3a8a,#2f6df6);
  color:#fff;padding:12px 16px;box-shadow:0 2px 10px rgba(20,40,90,.18)}
header h1{margin:0;font-size:17px;font-weight:800;letter-spacing:.5px}
header .sub{font-size:12px;opacity:.85;margin-top:2px}
header .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header a.back{color:#cfe0ff;text-decoration:none;font-size:12.5px;margin-left:auto}
main{max-width:1180px;margin:0 auto;padding:14px 12px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:0 1px 3px rgba(20,40,90,.06);padding:14px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:14.5px;font-weight:800}
.login{max-width:380px;margin:40px auto}
label{display:block;font-size:12.5px;color:var(--sub);margin:8px 0 4px}
input[type=text],input[type=password],textarea,select{width:100%;padding:9px 10px;border:1px solid var(--line);
  border-radius:8px;font-size:14px;background:#fbfcfe;color:var(--fg);font-family:inherit}
textarea{min-height:110px;font-family:Consolas,monospace;font-size:13px;resize:vertical}
input:focus,textarea:focus{outline:0;border-color:var(--acc);background:#fff}
button{padding:9px 14px;border:0;border-radius:8px;background:var(--acc);color:#fff;
  font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit}
button:hover{filter:brightness(1.06)}
button.ghost{background:#eef2fa;color:var(--acc)}
button:disabled{opacity:.55;cursor:not-allowed}
.layout{display:grid;grid-template-columns:250px 1fr;gap:14px;align-items:start}
@media(max-width:820px){.layout{grid-template-columns:1fr}}
.tbl-list{max-height:70vh;overflow:auto}
.tbl-item{display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:9px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.tbl-item:hover{background:#f3f6fd}
.tbl-item.on{background:#eaf1ff;border-color:#bcd2ff;font-weight:700}
.tbl-item .n{font-family:Consolas,monospace;font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
.tbl-item .c{font-size:11.5px;color:var(--sub);background:#f1f4f9;border-radius:20px;padding:1px 8px;flex:0 0 auto}
.tbl-item.on .c{background:#fff;color:var(--acc)}
.scroll{overflow:auto;max-height:64vh;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;
  white-space:pre-wrap;word-break:break-word;max-width:340px}
th{background:#f5f8fd;position:sticky;top:0;font-weight:700;color:#2b3550;z-index:2}
tr:hover td{background:#f8faff}
td.null{color:#b3bac9;font-style:italic}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:20px;background:#eef2fa;color:var(--sub)}
.badge.zb{background:#e6f0ff;color:#2f6df6}
.badge.pt{background:#fff0e0;color:var(--warn)}
.hint{font-size:12.5px;color:var(--sub);margin:6px 0 0}
.msg{padding:9px 11px;border-radius:8px;font-size:13px;margin-bottom:10px;display:none}
.msg.err{background:#fdecea;color:#b3261e;border:1px solid #f5c6c2;display:block}
.msg.ok{background:#e8f5e9;color:#1b5e20;border:1px solid #bfe3c6;display:block}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.pager{margin-top:10px;display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--sub)}
.sp{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:6px}
.sp.zb{background:var(--acc)} .sp.pt{background:var(--warn)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{background:#eef2fa;color:var(--sub)}
.tabs button.on{background:var(--acc);color:#fff}
.hide{display:none!important}
</style>
</head>
<body>
<header>
  <div class="row">
    <div>
      <h1>☁️ 云库数据表</h1>
      <div class="sub">Turso · wc-game-ku-521（aws-ap-northeast-1 东京）· 只读浏览</div>
    </div>
    <a class="back" href="/admin">← 返回后台</a>
  </div>
</header>

<main>
  <div id="msg" class="msg"></div>

  <!-- 登录 -->
  <div class="card login hide" id="loginBox">
    <h2>管理员登录</h2>
    <div class="hint" style="margin-bottom:8px">后台账号密码保存在服务器本地的 server_config.json，登录后可查看全部用户数据表。</div>
    <label>管理员账号</label>
    <input type="text" id="lgUser" value="ku521" autocomplete="username">
    <label>管理员密码</label>
    <input type="password" id="lgKey" placeholder="server_config.json 里的 admin_key" autocomplete="current-password">
    <div style="margin-top:12px"><button id="lgBtn" style="width:100%">登录</button></div>
  </div>

  <!-- 主界面 -->
  <div id="mainBox" class="hide">
    <div class="layout">
      <div class="card">
        <h2>数据表 <span class="badge" id="dbCount"></span></h2>
        <div class="tbl-list" id="tblList"></div>
      </div>
      <div>
        <div class="card">
          <div class="tabs">
            <button id="tabBrowse" class="on">浏览数据</button>
            <button id="tabSql">SQL 查询</button>
          </div>

          <div id="paneBrowse">
            <div class="bar">
              <b id="curTbl" style="font-size:14px">—</b>
              <span class="badge" id="curCnt"></span>
              <span style="margin-left:auto"></span>
              <select id="pageSize" style="width:auto;padding:6px 8px">
                <option value="25">25 行/页</option>
                <option value="50" selected>50 行/页</option>
                <option value="100">100 行/页</option>
                <option value="200">200 行/页</option>
              </select>
              <button class="ghost" id="reloadBtn">刷新</button>
            </div>
            <div class="scroll"><table id="dataTable"></table></div>
            <div class="pager">
              <button class="ghost" id="prevBtn">← 上一页</button>
              <button class="ghost" id="nextBtn">下一页 →</button>
              <span id="pageInfo"></span>
            </div>
          </div>

          <div id="paneSql" class="hide">
            <textarea id="sqlBox" spellcheck="false" placeholder="SELECT username, member, expire, created_at FROM zb_users ORDER BY created_at DESC"></textarea>
            <div class="bar" style="margin-top:8px">
              <button id="runBtn">执行查询</button>
              <button class="ghost" id="quickBtn">示例：最近注册用户</button>
              <span class="hint" style="margin:0">仅允许 SELECT / WITH，只读</span>
            </div>
            <div class="scroll"><table id="sqlTable"></table></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
let TABLES = [], cur = '', offset = 0, total = 0;

function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}
function showMsg(text, kind){
  const m=$('msg'); m.textContent=text; m.className='msg '+(kind||'err');
  if(kind==='ok') setTimeout(()=>{m.className='msg';},2600);
}
async function api(path, opt){
  opt = opt||{};
  const init = {method: opt.method||'GET', credentials:'same-origin', headers:{}};
  if(opt.body){ init.headers['Content-Type']='application/json'; init.body=JSON.stringify(opt.body); }
  const r = await fetch(path, init);
  let d = null;
  try{ d = await r.json(); }catch(e){}
  if(r.status===401){ showLogin(); throw new Error('未登录'); }
  if(!r.ok) throw new Error((d&&d.msg)||('请求失败 '+r.status));
  return d;
}
function showLogin(){ $('loginBox').classList.remove('hide'); $('mainBox').classList.add('hide'); }

// —— 登录 ——
$('lgBtn').onclick = async () => {
  try{
    await api('/api/admin/login',{method:'POST',body:{user:$('lgUser').value.trim(),key:$('lgKey').value}});
    $('lgKey').value='';
    $('loginBox').classList.add('hide'); $('mainBox').classList.remove('hide');
    await loadTables();
  }catch(e){ showMsg(e.message||'登录失败'); }
};

// —— 加载表清单 ——
async function loadTables(){
  try{
    const d = await api('/api/admin/tables');
    TABLES = d.tables||[];
    $('dbCount').textContent = TABLES.length + ' 张';
    const box=$('tblList'); box.innerHTML='';
    TABLES.forEach(t=>{
      const isZb = t.table.indexOf('zb_')===0;
      const el=document.createElement('div');
      el.className='tbl-item'+(cur===t.table?' on':'');
      el.innerHTML='<span class="n"><span class="sp '+(isZb?'zb':'pt')+'"></span>'+esc(t.table)+'</span>'+
                    '<span class="c">'+(t.rows<0?'?':t.rows)+'</span>';
      el.onclick=()=>{ cur=t.table; offset=0; renderList(); loadRows(); };
      box.appendChild(el);
    });
    if(!cur && TABLES.length){ cur=TABLES[0].table; }
    renderList();
    if(cur) loadRows();
  }catch(e){ showMsg(e.message||'加载表清单失败'); }
}
function renderList(){
  [...$('tblList').children].forEach((el,i)=>{
    el.classList.toggle('on', TABLES[i] && TABLES[i].table===cur);
  });
  const t = TABLES.find(x=>x.table===cur);
  $('curTbl').textContent = cur || '—';
  $('curCnt').textContent = t ? (t.rows<0?'行数未知':t.rows+' 行') : '';
}

// —— 浏览数据 ——
async function loadRows(){
  if(!cur) return;
  const lim = parseInt($('pageSize').value,10)||50;
  try{
    const d = await api('/api/admin/rows?table='+encodeURIComponent(cur)+'&limit='+lim+'&offset='+offset);
    total = d.total||0;
    renderTable($('dataTable'), d.rows||[]);
    const from = total? offset+1 : 0, to = Math.min(offset+lim, total);
    $('pageInfo').textContent = '第 '+from+'-'+to+' 条 / 共 '+total+' 条';
    $('prevBtn').disabled = offset<=0;
    $('nextBtn').disabled = offset+lim>=total;
  }catch(e){ showMsg(e.message||'读取失败'); }
}
function renderTable(table, rows){
  if(!rows.length){ table.innerHTML='<tbody><tr><td style="color:#8b93a7">（无数据）</td></tr></tbody>'; return; }
  const cols = Object.keys(rows[0]);
  let h='<thead><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>';
  rows.forEach(r=>{
    h+='<tr>'+cols.map(c=>{
      const v=r[c];
      if(v===null||v===undefined) return '<td class="null">NULL</td>';
      return '<td>'+esc(v)+'</td>';
    }).join('')+'</tr>';
  });
  table.innerHTML=h+'</tbody>';
}
$('prevBtn').onclick=()=>{ const lim=parseInt($('pageSize').value,10)||50; offset=Math.max(0,offset-lim); loadRows(); };
$('nextBtn').onclick=()=>{ const lim=parseInt($('pageSize').value,10)||50; if(offset+lim<total){ offset+=lim; loadRows(); } };
$('pageSize').onchange=()=>{ offset=0; loadRows(); };
$('reloadBtn').onclick=()=>{ loadTables(); };

// —— SQL 查询 ——
$('tabBrowse').onclick=()=>{ $('tabBrowse').classList.add('on'); $('tabSql').classList.remove('on');
  $('paneBrowse').classList.remove('hide'); $('paneSql').classList.add('hide'); };
$('tabSql').onclick=()=>{ $('tabSql').classList.add('on'); $('tabBrowse').classList.remove('on');
  $('paneSql').classList.remove('hide'); $('paneBrowse').classList.add('hide'); };
$('quickBtn').onclick=()=>{ $('sqlBox').value="SELECT username, status, member, expire, member_grades, created_at FROM zb_users ORDER BY created_at DESC"; };
$('runBtn').onclick=async ()=>{
  const sql=$('sqlBox').value.trim();
  if(!sql) return showMsg('请输入 SQL');
  try{
    const d = await api('/api/admin/sql',{method:'POST',body:{sql}});
    renderTable($('sqlTable'), d.rows||[]);
    showMsg('查询成功，返回 '+(d.rows||[]).length+' 行'+(d.truncated?'（已截断至 500 行）':''),'ok');
  }catch(e){ showMsg(e.message||'查询失败'); }
};

// —— 启动：先试已登录状态 ——
(async()=>{
  try{ await api('/api/admin/tables'); $('mainBox').classList.remove('hide'); await loadTables(); }
  catch(e){ showLogin(); }
})();
</script>
</body>
</html>
